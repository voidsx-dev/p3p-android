name: build-apk

on:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Test Maxwell block discovery
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I games/p3p/import tests/p3p_maxwell_test.cpp -o "$RUNNER_TEMP/p3p-maxwell-test"
          "$RUNNER_TEMP/p3p-maxwell-test"

      - name: Build and test the P3P local shader compiler
        run: |
          docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            bash games/p3p/tools/build_harness_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libspirvharness
          path: |
            private/build/spirv_harness_android/libspirvharness.so
            private/build/spirv_harness_android/licenses/*.txt
          if-no-files-found: error

  apk:
    needs: harness
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libspirvharness
          path: private/build/spirv_harness_android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test local cache readiness
        shell: pwsh
        run: |
          $classes = Join-Path $env:RUNNER_TEMP "p3p-cache-tests"
          New-Item -ItemType Directory -Force $classes | Out-Null
          javac -encoding UTF-8 --release 8 -d $classes games/p3p/java/io/github/p3pandroid/PreparationFiles.java tests/P3pPreparationTest.java
          if ($LASTEXITCODE) { throw "cache checks did not compile" }
          java -cp $classes io.github.p3pandroid.P3pPreparationTest
          if ($LASTEXITCODE) { throw "local cache checks failed" }

      - name: cmake and ninja
        run: pip install cmake ninja

      - name: Vulkan headers
        run: git clone --depth 1 --branch v1.4.357 https://github.com/KhronosGroup/Vulkan-Headers private/third_party/Vulkan-Headers-1.4.357

      - name: Android SDK pieces
        shell: pwsh
        run: |
          $sdkm = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkm)) { throw "sdkmanager not found at $sdkm" }
          ("y`n" * 20) | & $sdkm --licenses | Out-Null
          & $sdkm "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          if ($LASTEXITCODE) { throw "sdkmanager failed" }

      - name: Restore or create persistent signing key
        id: signing
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          $androidDir = "$env:USERPROFILE\.android"
          New-Item -ItemType Directory -Force $androidDir | Out-Null
          $keystorePath = Join-Path $androidDir "debug.keystore"

          if ([string]::IsNullOrWhiteSpace($env:ANDROID_DEBUG_KEYSTORE_BASE64)) {
            keytool -genkeypair -keystore $keystorePath -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            if ($LASTEXITCODE) { throw "Could not generate signing key" }

            $base64Path = Join-Path $env:RUNNER_TEMP "android-debug-keystore-base64.txt"
            $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($keystorePath))
            Set-Content -Path $base64Path -Value $base64 -NoNewline -Encoding ascii

            "needs_secret=true" >> $env:GITHUB_OUTPUT
          }
          else {
            $bytes = [Convert]::FromBase64String($env:ANDROID_DEBUG_KEYSTORE_BASE64.Trim())
            [IO.File]::WriteAllBytes($keystorePath, $bytes)

            keytool -list -keystore $keystorePath -storepass android -alias androiddebugkey
            if ($LASTEXITCODE) { throw "Stored signing key is invalid" }

            "needs_secret=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload signing key setup
        if: steps.signing.outputs.needs_secret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p3p-signing-key-setup
          path: ${{ runner.temp }}/android-debug-keystore-base64.txt
          retention-days: 1
          if-no-files-found: error

      - name: Stop until signing secret is configured
        if: steps.signing.outputs.needs_secret == 'true'
        shell: pwsh
        run: |
          throw "Signing key created. Download the p3p-signing-key-setup artifact and save its content as the repository secret ANDROID_DEBUG_KEYSTORE_BASE64. Then rerun this workflow."

      - name: Build the APK
        shell: powershell
        run: |
          $env:VULKAN_SDK = "$PWD\private\third_party\Vulkan-Headers-1.4.357"
          powershell -NoProfile -ExecutionPolicy Bypass -File android\build_apk.ps1 -Game p3p -Nce
          if ($LASTEXITCODE) { throw "build_apk.ps1 failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: p3p-apk
          path: private/p3p/apk_nce/p3p.apk
          if-no-files-found: error
